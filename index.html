        let currentLang = 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            const root = document.getElementById('htmlRoot');
            root.setAttribute('lang', lang);
            root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });

            const foodInput = document.getElementById('foodSearchInput');
            if (foodInput && translations[lang].food_search_ph) {
                foodInput.placeholder = translations[lang].food_search_ph;
            }

            ['ar', 'en', 'tr'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (btn) {
                    if (l === lang) {
                        btn.className = "px-2.5 py-1.5 rounded-lg transition duration-300 bg-accent text-ink";
                    } else {
                        btn.className = "px-2.5 py-1.5 rounded-lg transition duration-300 text-zinc-400 hover:text-zinc-100";

            });

            renderFoodCategories();
            renderFoodResults();
        }

        const foodData = [

            { cat: "fish", ar: "جمبري (روبيان) مسلوق", en: "Boiled Shrimp", tr: "Haşlanmış Karides", kcal: 99, p: 24, c: 0.2, f: 0.3 },

            { cat: "dairy", ar: "جبنة قريش", en: "Cottage Cheese", tr: "Lor Peyniri", kcal: 98, p: 11, c: 3.4, f: 4.3 },
            { cat: "dairy", ar: "بيضة كاملة مسلوقة", en: "Boiled Whole Egg", tr: "Haşlanmış Yumurta", kcal: 155, p: 13, c: 1.1, f: 11 },
            { cat: "dairy", ar: "بياض بيض فقط", en: "Egg White Only", tr: "Sadece Yumurta Akı", kcal: 52, p: 11, c: 0.7, f: 0.2 },
            { cat: "grains", ar: "أرز أبيض مطبوخ", en: "Cooked White Rice", tr: "Pişmiş Beyaz Pirinç", kcal: 130, p: 2.7, c: 28, f: 0.3 },

            { cat: "nuts", ar: "جوز", en: "Walnuts", tr: "Ceviz", kcal: 654, p: 15, c: 14, f: 65 },
            { cat: "nuts", ar: "زيت زيتون", en: "Olive Oil", tr: "Zeytinyağı", kcal: 884, p: 0, c: 0, f: 100 }
        ];

        const foodCategories = ["all", "poultry", "redmeat", "fish", "dairy", "grains", "veg", "fruit", "nuts"];
        let activeFoodCategory = "all";

        function renderFoodCategories() {
            const wrap = document.getElementById('foodCategoryTabs');
            if (!wrap) return;
            wrap.innerHTML = foodCategories.map(cat => {
                const label = translations[currentLang][`food_cat_${cat}`];
                const active = cat === activeFoodCategory;
                const cls = active
                    ? "bg-accent text-ink border-accent font-extrabold"
                    : "bg-surface text-zinc-400 border-line hover:border-accent/50 hover:text-zinc-200 font-medium";
                return `<button type="button" data-cat="${cat}" class="food-cat-btn shrink-0 whitespace-nowrap px-4 py-2 rounded-xl border text-xs transition duration-200 ${cls}">${label}</button>`;
            }).join('');

            wrap.querySelectorAll('.food-cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeFoodCategory = btn.getAttribute('data-cat');
                    renderFoodCategories();
                    renderFoodResults();
                });
            });
        }

        function renderFoodResults() {
            const grid = document.getElementById('foodResultsGrid');
            const empty = document.getElementById('foodEmptyState');
            if (!grid) return;

            const query = (document.getElementById('foodSearchInput')?.value || "").trim().toLowerCase();
            const t = translations[currentLang];

            const results = foodData.filter(item => {
                const matchesCat = activeFoodCategory === "all" || item.cat === activeFoodCategory;
                const haystack = `${item.ar} ${item.en} ${item.tr}`.toLowerCase();
                const matchesQuery = query === "" || haystack.includes(query);
                return matchesCat && matchesQuery;
            });

            if (results.length === 0) {
                grid.innerHTML = "";
                if (empty) empty.classList.remove('hidden');
                return;
            }
            if (empty) empty.classList.add('hidden');

            grid.innerHTML = results.map(item => {
                const name = item[currentLang] || item.ar;
                const catLabel = t[`food_cat_${item.cat}`];
                return `
                <div class="bg-surface border border-line rounded-2xl p-4 flex flex-col justify-between gap-3 shadow-md hover:border-accent/40 transition duration-300">
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="font-bold text-sm text-zinc-100 leading-snug">${name}</h4>
                        <span class="shrink-0 text-[10px] text-zinc-400 bg-ink px-2.5 py-1 rounded-lg border border-line whitespace-nowrap">${catLabel}</span>
                    </div>
                    <div class="flex items-end justify-between pt-2 border-t border-line/60">
                        <div class="flex items-baseline gap-1">
                            <span class="font-display text-3xl text-accent leading-none">${item.kcal}</span>
                            <span class="text-[11px] text-zinc-400">kcal <span class="text-zinc-600">(${t.food_per})</span></span>
                        </div>
                        <div class="flex gap-2 text-[11px] text-zinc-300 bg-ink/70 px-2.5 py-1 rounded-lg border border-line">
                            <span title="Protein"><b class="text-accent">P:</b> ${item.p}g</span>
                            <span title="Carbs"><b class="text-accent">C:</b> ${item.c}g</span>
                            <span title="Fat"><b class="text-accent">F:</b> ${item.f}g</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        document.getElementById('foodSearchInput').addEventListener('input', renderFoodResults);
        renderFoodCategories();
        renderFoodResults();
    </script>
